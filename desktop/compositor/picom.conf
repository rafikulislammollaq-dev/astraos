# /etc/astraos/picom.conf - the AstraOS compositor profile.
#
# NOT STARTED BY DEFAULT. The xfwm4 compositor is the default (it is the most
# reliable thing in a VirtualBox without 3D acceleration). `astra effects on`
# copies this file to ~/.config/picom/picom.conf, registers the session
# autostart entry and switches xfwm4 compositing off; `astra effects off`
# reverses all three. See the toggle in packages/astraos-winbridge
# root/usr/bin/astra.
#
# WHAT THIS PROFILE DOES
#   * fade: windows fade in when they open and out when they close - the
#     single most visible "smooth" upgrade, and the one Android-style motion
#     cue picom can do without a patched fork
#   * shadows with a soft, low profile (the window chrome in docs/DESIGN.md)
#   * vsync on, no blur: blur is the single most expensive effect picom has
#     and the GTK theme already produces the glass look with flat surfaces
#
# Every value here is the conservative end of its range: this must feel good
# on the integrated-graphics laptops this distribution targets.

backend = "glx";
vsync = true;

# --- Fading -------------------------------------------------------------------
fading = true;
fade-delta = 8;
fade-in-step = 0.10;
fade-out-step = 0.10;

# --- Shadows ------------------------------------------------------------------
shadow = true;
shadow-radius = 16;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.55;

# Surfaces that must not carry a shadow (they are chrome, not windows).
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'screenshotter'",
    "class_g = 'Xfce4-notifyd'",
    "class_g = 'Xfce4-panel'",
    "class_g = 'Plank'",
    "_GTK_FRAME_EXTENTS@"
];

# --- Opacity ------------------------------------------------------------------
# No blanket window opacity: the xfwm4 theme owns the glass look. Menus and
# tooltips get a touch of transparency, which picom applies smoothly.
opacity-rule = [
    "93:class_g = 'Xfce4-whiskermenu' && focused",
    "90:class_g = 'xfce4-appfinder'",
    "95:class_g = 'Xfce4-notifyd'"
];

# --- Window types -------------------------------------------------------------
wintypes:
{
    dock = { shadow = false; fade = false; };
    dnd = { shadow = false; fade = false; };
    tooltip = { fade = true; shadow = false; focus = true; };
    menu = { fade = true; shadow = false; };
    popup_menu = { fade = true; shadow = false; };
    dropdown_menu = { fade = true; shadow = false; };
    notification = { fade = true; shadow = false; };
};

# --- Performance guards -------------------------------------------------------
# Never unredirect in fullscreen by default: it makes videos tear when
# compositing resumes. Leave damage tracking on; it is what keeps repaints
# cheap on modest GPUs.
unredir-if-possible = false;
use-damage = true;
