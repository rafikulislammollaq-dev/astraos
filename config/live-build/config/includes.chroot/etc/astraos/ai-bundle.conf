# Pinned inputs for the assistant the image ships.
#
# WHY THESE ARE PINNED AND HASHED
#
#   The image build fetches the engine and two model files from the network.
#   A URL that can change under the build is not a build input, it is a guess:
#   the artifact on the other end can be replaced at any time. Every URL here
#   names an exact revision or release, and every SHA-256 is the one measured
#   when that revision was published. 0650-ai.hook.chroot refuses to continue
#   when a byte does not match, so a bad fetch fails the build instead of
#   shipping a model nobody checked.
#
# WHAT IS DELIBERATELY NOT HERE
#
#   The middle brain (spark-x2.5-4b-q4_k_m, ~2.4 GB) and the optional tiers.
#   The executor is the tier that must exist for the assistant to do anything;
#   the brain is an upgrade a user chooses with `astra-ai setup --model`. That
#   keeps the image about 1.1 GB larger rather than 3.5 GB larger.
#
# WHERE THE VALUES COME FROM
#
#   Engine:   release ai-engine-2026-10-19, built by workflow run 39244594257
#             (commit d226ad3db66c2ab527099482f2e635f125f2612e),
#             llama.cpp 0.7.0-dev build 1 (commit 098ce52).
#   Model:    Hugging Face revision 1f7fa33b1245c14730da39e125714ad3a327901b,
#             Apache-2.0.
#   Speech:   whisper.cpp revision 5359861c739e955e79d9a303bcbc70fb988958b1.

