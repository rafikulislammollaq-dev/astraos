# /etc/ufw/ufw.conf
#
# AstraOS change to the ufw package's default: the firewall starts on boot.
#
# The decision and its evidence are recorded in docs/ROADMAP.md and docs/SECURITY.md
# section 3. In short: a firewall that waits to be enabled protects exactly the users
# who never enable it, so this release makes it the default. Inbound is denied; the
# only exceptions are the assistant's page (8765/tcp, pairing-gated) and local service
# discovery (5353/udp, what finds printers), both only from the private address ranges.
# The rules themselves live next to this file, in /etc/ufw/user.rules (IPv4) and
# /etc/ufw/user6.rules (IPv6), installed by the build hook
# config/live-build/config/hooks/live/0100-identity.hook.chroot from the staged,
# version-controlled copies in system/security/.
#
# The package default is ENABLED=no. Turning the firewall off is fully supported and
# is the user's decision to make; it stays off until it is turned back on:
#
#   sudo ufw disable          # off; sudo ufw enable brings it back
#   sudo ufw status verbose   # what is active right now
#   sudo ufw allow 8765/tcp   # widen a rule (for example, a public-IPv6 LAN)
#
# The rules as shipped are explained for the reader of the installed system in
# /etc/ufw/astraos-policy.conf. The build's security hook refuses to build an image in
# which this file or the rule files stop saying what they say.

# Set to yes to start on boot. If setting this remotely, be sure to add a rule
# to allow your remote connection before starting ufw. Eg: 'ufw allow 22/tcp'
ENABLED=yes

# Please use the 'ufw' command to set the loglevel. Eg: 'ufw logging medium'.
# See 'man ufw' for details.
LOGLEVEL=low
