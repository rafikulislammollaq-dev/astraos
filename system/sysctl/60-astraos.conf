# AstraOS kernel and network defaults.
# Installed to /etc/sysctl.d/60-astraos.conf by 0400-services.hook.chroot.
#
# Deliberately conservative: every setting below is a long-standing, well-understood
# default for a desktop Linux system. Nothing here is exotic, and nothing here is
# claimed to be a security boundary on its own (plan §13).
#
# This is NOT a hardened server profile. AstraOS is a general-purpose desktop.

# --- Kernel information exposure ------------------------------------------------
# Restrict dmesg/kernel address information to privileged users. Some desktop tools
# need dmesg, so this is the "restricted" profile rather than fully locked down.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 1

# Do not let unprivileged users attach eBPF or use the kernel performance events
# interface without a capability.
kernel.unprivileged_bpf_disabled = 1
kernel.perf_event_paranoid = 2

# Restrict ptrace to direct descendants. Note that this can interfere with some
# debuggers; developers who need full ptrace can set kernel.yama.ptrace_scope=0.
kernel.yama.ptrace_scope = 1

# --- Core dumps -----------------------------------------------------------------
# Do not write core dumps containing process memory to disk by default.
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# --- Memory layout --------------------------------------------------------------
# Randomise the virtual address space. 2 is the upstream default.
kernel.randomize_va_space = 2

# --- Network --------------------------------------------------------------------
# Basic spoofing/redirect protection. These are compatible with normal desktop
# networking including DHCP, VPNs and virtual machines.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# --- Desktop responsiveness -----------------------------------------------------
# Keep swap use reasonable on desktop workloads so the system stays interactive.
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Increasing the inotify watch limit prevents "too many open files" failures in
# editors, IDEs and file indexers, which is a common desktop complaint.
fs.inotify.max_user_watches = 524288

# --- Filesystem behaviour -------------------------------------------------------
# Restricting hardlink/symlink creation to the owner blocks a well-known class of
# race-condition attacks. Both settings are upstream defaults on many distributions.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# --- Kernel panics --------------------------------------------------------------
# Reboot automatically after a panic rather than hanging forever on a desktop.
kernel.panic = 10
kernel.panic_on_oops = 0
