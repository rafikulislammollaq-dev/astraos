# AstraOS ISO build.
#
# Manually triggered on purpose. A full OS build takes a long time and downloads several
# gigabytes, so it must never be the automatic response to a commit (plan §17).
#
# The workflow runs the SAME scripts as a local build, so CI cannot drift from the
# documented procedure. If a step here is not in docs/BUILDING.md, that is a bug.
#
# WHY THE IMAGE IS BUILT INSIDE A DEBIAN 13 CONTAINER
# --------------------------------------------------
# The GitHub runner is Ubuntu 24.04. Its debootstrap and live-build are older than the
# release AstraOS pins, and an older debootstrap writes the pre-bookworm security suite
# naming into the new chroot:
#
#   deb http://security.debian.org/debian-security trixie/updates main ...
#
# That suite does not exist in Debian 13 (it is trixie-security), so `apt-get update`
# inside the chroot fails and the build stops — a mismatch between the build host and the
# distribution being built, not a defect in AstraOS. An older live-build also lacks
# --bootloaders, which silently produced a UEFI-only image with no legacy BIOS support.
#
# Building inside debian:trixie removes both problems at once: the toolchain is the same
# release that is being assembled, which is how a distribution is supposed to be built.
# The container needs --privileged because live-build mounts filesystems and chroots.

name: Build ISO

on:
  workflow_dispatch:
    inputs:
      skip_bootstrap:
        description: "Skip installing build dependencies (they are usually already present)"
        type: boolean
        default: false
      upload_artifact:
        description: "Upload the ISO as a workflow artifact"
        type: boolean
        default: true
      smoke_boot:
        description: "After building, boot the ISO in QEMU (the self-test, then the boot menus)"
        type: boolean
        default: true
      install_boot:
        description: "After building, install the ISO onto a blank disk in QEMU and boot the result"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build AstraOS ISO
    runs-on: ubuntu-24.04
    # A live desktop image with a browser and office tools takes a long time to assemble.
    timeout-minutes: 300
    env:
      # The image is assembled here, inside the container. CI cannot use a path outside the
      # workspace, so it is a directory of its own.
      BUILD_CONTAINER: astraos-build-container

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The build manifest records the commit that produced the image.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report the release identity
        run: |
          echo "### AstraOS build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat VERSION >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Static checks before spending build time
        run: |
          # Fail fast: no point burning an hour of build time on a repository that does
          # not pass its own checks.
          python3 tests/run.py

      - name: Verify the package selection
        run: python3 scripts/verify-package-availability.py

      - name: Free disk space
        run: |
          # A live-build tree needs well over 10 GB, and the runner image ships several
          # gigabytes of toolchains nothing here uses. Removing them is faster than failing
          # halfway through the chroot stage.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Start the Debian 13 build container
        run: |
          docker run --detach --name "$BUILD_CONTAINER" \
            --privileged \
            --volume "$PWD:/astraos" \
            --workdir /astraos \
            --env DEBIAN_FRONTEND=noninteractive \
            --env "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" \
            debian:trixie sleep infinity
          docker exec "$BUILD_CONTAINER" bash -c '
            set -eu
            # git and ca-certificates are needed before the bootstrap script runs: the
            # scripts read the workspace out of a git checkout (for the reproducible
            # timestamp) and fetch over TLS. The minimal image has neither.
            apt-get update >/dev/null
            apt-get install -y --no-install-recommends ca-certificates git >/dev/null
            # The workspace belongs to the runner user, but the container runs as root.
            git config --global --add safe.directory /astraos
            echo "container ready: $(. /etc/os-release && echo "$PRETTY_NAME")"'

      - name: Install build dependencies
        if: ${{ inputs.skip_bootstrap != true }}
        run: |
          # No privilege prefix: the container runs as root, and the script installs
          # packages directly when it is root.
          docker exec "$BUILD_CONTAINER" ./scripts/bootstrap-build-environment.sh --yes

      - name: Validate the build host, inside the container
        run: docker exec "$BUILD_CONTAINER" ./scripts/validate-environment.sh

      - name: Build the image
        run: |
          # The container is root and privileged, so build-iso.sh elevates nothing here;
          # the same script run as an ordinary user elevates only the live-build commands.
          docker exec "$BUILD_CONTAINER" ./scripts/build-iso.sh

      - name: Show what was produced
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/ >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/*.manifest >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no manifest found"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/*.sha256 >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no checksum found"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the build container
        if: always()
        run: |
          docker exec "$BUILD_CONTAINER" bash -c 'for d in /astraos/build/live-build/chroot /astraos/build/live-build/binary; do
              mountpoint -q "$d" && umount -R "$d" || true
            done' || true
          docker rm --force "$BUILD_CONTAINER" || true

      - name: Assemble the APT repository
        run: |
          # The .debs the build produced, laid out as the archive an installed system
          # can point apt at (pool/ files, Packages, Release). Unsigned here: no
          # signing key lives in CI; scripts/build-apt-repo.sh says so loudly, and its
          # read-back re-hashes every file the index names before it reports success.
          ./scripts/build-apt-repo.sh --debs build/live-build/packages --out dist/apt-repo

      - name: Upload the ISO
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: astraos-iso
          # The ISO is large; keep the artifact window short so storage does not grow
          # without bound.
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.iso
            dist/*.iso.sha256
            dist/*.iso.manifest
            dist/astraos-packages.txt

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astraos-build-logs
          retention-days: 14
          if-no-files-found: warn
          path: |
            logs/
            build/live-build/*.log
            build/live-build/.astraos-config-options

      - name: Upload the APT repository
        uses: actions/upload-artifact@v4
        with:
          name: astraos-apt-repo
          retention-days: 14
          if-no-files-found: error
          path: dist/apt-repo/

      - name: Record what was NOT tested
        if: always()
        run: |
          {
            echo ""
            echo "### Not tested by this workflow"
            echo ""
            echo "The build job assembles the image and validates its structure. Three"
            echo "jobs then boot it: smoke-boot starts the kernel taken out of the ISO"
            echo "and runs the image's own self-test; boot-menus boots the ISO through"
            echo "its own boot menus (syslinux on BIOS, GRUB on UEFI, and GRUB under"
            echo "Secure Boot-enforcing firmware) and waits for the live system's login"
            echo "prompt; install-boot installs the ISO onto a blank"
            echo "disk through the ISO's own installer and boots that disk alone, with"
            echo "no medium attached. When those jobs are skipped, the image was **not**"
            echo "booted."
            echo ""
            echo "install-boot has not yet produced an installed system: its first"
            echo "run never reached the guest (QEMU refused the driver's tablet, run"
            echo "38919644411) and its second reached a running installer that exited"
            echo "at startup on a missing branding key (run 38924527286; fixed, retry"
            echo "pending). Until a green run is recorded, CI has never installed"
            echo "AstraOS. The manual path - real hardware, or a virtual machine"
            echo "someone drives by hand - remains docs/INSTALLATION_VIRTUALBOX.md."
            echo ""
            echo "The APT archive this build assembled (dist/apt-repo, uploaded as"
            echo "astraos-apt-repo) is unsigned, and no installed system has ever"
            echo "fetched updates from one."
            echo ""
            echo "The manifest records them as UNTESTED until they are actually performed."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-boot:
    name: Boot the ISO and self-test it
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.smoke_boot }}
    runs-on: ubuntu-24.04
    # An emulated boot of a live desktop image plus the self-test. KVM is used when the
    # runner provides it; QEMU emulation is the fallback - slower, not different.
    # The first TCG attempt (run 38871459329, 2026-10-16) never reported a result (its
    # self-test unit had been skipped by an ordering cycle, fixed in the unit file); the
    # first green run (38881934636) clocked the emulated boot: login prompt at 143.7 s,
    # RESULT PASS (39 checks), the whole boot job 6m28s. Both windows keep margin over
    # that: the driver's self-test window (120 min) and this ceiling.
    timeout-minutes: 150

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the ISO
        uses: actions/download-artifact@v4
        with:
          name: astraos-iso
          path: iso

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 imagemagick

      - name: Boot the ISO and run its self-test
        run: |
          ls -la iso/
          ./scripts/smoke-boot.sh --timeout 120 --out smoke-out iso/*.iso

      - name: Summarise the self-test
        if: always()
        run: |
          {
            echo "### Boot self-test"
            echo ""
            if [ -f smoke-out/serial.log ]; then
              echo '```'
              grep 'ASTRAOS-SMOKE:' smoke-out/serial.log || echo "no self-test output on the serial console"
              echo '```'
            else
              echo "The self-test never wrote to the serial console."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astraos-boot-self-test
          retention-days: 14
          if-no-files-found: warn
          path: smoke-out/

  boot-menus:
    name: Boot the ISO through its own boot menus
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.smoke_boot }}
    runs-on: ubuntu-24.04
    # Three emulated boots, firmware and bootloader included. The measured direct-kernel
    # emulated boot (run 38881934636) reached its login prompt in about 144 s; the menu
    # path adds firmware and the bootloader in front of that (both original menu paths
    # together took 6m41s in run 38913161772), and each run keeps the wait
    # scripts/boot-menu-test.sh was given (25 min). This ceiling covers all three runs
    # plus the ISO download and the QEMU/OVMF install with margin.
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the ISO
        uses: actions/download-artifact@v4
        with:
          name: astraos-iso
          path: iso

      - name: Install QEMU and the UEFI firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Boot through the syslinux menu (BIOS)
        run: ./scripts/boot-menu-test.sh --medium bios --out menus-bios iso/*.iso

      - name: Boot through the GRUB menu (UEFI)
        # Even when the BIOS run failed, the UEFI evidence is worth having: the two
        # firmware paths fail for different reasons, and one dispatch should show both.
        if: always()
        run: ./scripts/boot-menu-test.sh --medium efi --out menus-efi iso/*.iso

      - name: Boot through the GRUB menu under Secure Boot (UEFI)
        # What a Windows laptop with Secure Boot on does. This run boots the same ISO
        # under OVMF's Secure Boot firmware with the Microsoft keys enrolled, so
        # reaching the login prompt means the firmware verified the ISO's own chain -
        # Microsoft-signed shim, Debian-signed GRUB, Debian-signed kernel - instead of
        # refusing an unsigned medium.
        if: always()
        run: ./scripts/boot-menu-test.sh --medium secure --out menus-secure iso/*.iso

      - name: Summarise the boot-menu runs
        if: always()
        run: |
          {
            echo "### Boot menus"
            echo ""
            echo "Each run boots the ISO through QEMU's own firmware and the ISO's own"
            echo "bootloader menu - the host supplies no kernel and no command line - and"
            echo "succeeds when the live system's login prompt appears on the serial"
            echo "console."
            echo ""
            for medium in bios efi secure; do
              log="menus-${medium}/serial.log"
              if [ ! -f "$log" ]; then
                echo "- **${medium}**: no serial log was produced"
              elif grep -qF 'login:' "$log"; then
                echo "- **${medium}**: reached the login prompt"
              else
                echo "- **${medium}**: did NOT reach the login prompt (see the artifact)"
              fi
            done
            echo ""
            echo '```'
            for medium in bios efi secure; do
              log="menus-${medium}/serial.log"
              if [ -f "$log" ]; then
                echo "--- ${medium}: last serial lines"
                tail -n 5 "$log"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the boot-menu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astraos-boot-menus
          retention-days: 14
          if-no-files-found: warn
          path: |
            menus-bios/
            menus-efi/
            menus-secure/

  install-boot:
    name: Install the ISO onto a disk and boot it
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.install_boot }}
    runs-on: ubuntu-24.04
    # Two emulated boots with a full Calamares install between them (the long pole),
    # plus converting and loop-mounting the installed disk on the host.
    # scripts/install-boot-test.sh budgets each half by itself (--timeout is per
    # half); this ceiling covers both halves plus the ISO download and the QEMU
    # install with margin.
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the ISO
        uses: actions/download-artifact@v4
        with:
          name: astraos-iso
          path: iso

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils imagemagick

      - name: Install the ISO and boot the installed system
        run: |
          ls -la iso/
          ./scripts/install-boot-test.sh --timeout 45 --out install-out iso/*.iso

      - name: Summarise the install exercise
        if: always()
        run: |
          {
            echo "### Install exercise"
            echo ""
            echo "The first boot installs the ISO onto a blank disk through the ISO's"
            echo "own Calamares UI, driven over the QEMU monitor; the second boots that"
            echo "disk alone, with no medium attached, and expects the image's own"
            echo "self-test in its installed mode."
            echo ""
            if [ -f install-out/done ]; then
              echo "- installer report: \`$(cat install-out/done)\`"
            else
              echo "- installer report: none was written"
            fi
            echo ""
            echo '```'
            if [ -f install-out/serial2.log ]; then
              grep 'ASTRAOS-SMOKE:' install-out/serial2.log \
                || echo "no self-test output on the installed system's console"
            else
              echo "the installed system never wrote to a serial console"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astraos-install-test
          retention-days: 14
          if-no-files-found: warn
          path: install-out/
