# AstraOS: the installed system must never log a user in without authentication.
#
# WHY THIS MODULE EXISTS
#
# There are two systems on one medium, and they need opposite answers.
#
# The live medium MUST autologin. The live account is throwaway, its password is
# public (live-config sets it to `live`), and a boot that stops at a password prompt
# is a boot nobody can use. live-config arranges that by editing the commented
# autologin keys in /etc/lightdm/lightdm.conf while the medium boots.
#
# The installed system must NOT autologin: it holds the user's real data and their
# real password, and it is the system that stays (plan §7.3, §10.4).
#
# Calamares installs the live filesystem verbatim - including the lightdm.conf that
# live-config rewrote on this boot, and including any drop-in the live medium added.
# Without this module the installed system would inherit the live autologin, which is
# exactly the leak that a 0.2.0 build would have shipped.
#
# WHY IT IS A SCRIPT AND NOT A FILE
#
# A file in the image is the thing that gets copied by accident. A step that runs on
# the target, after unpackfs, is the thing that cannot be.
#
# This runs after the displaymanager module because both touch the same files, and
# this one has to be last.
#
# WHY IT IS CALLED shellprocess.conf
#
# Because Calamares resolves a module instance by the name of its configuration file
# and then looks for a module *directory* with that name. `shellprocess` is one of the
# modules Calamares ships, and it runs a shell script in the target - which is exactly
# what is needed. The build hook 0300-installer.hook.chroot refuses to build a sequence
# that names a module without an installed module directory, so a friendlier name such
# as `lockdown.conf` would need us to ship and maintain a Calamares module of our own
# for one short script. The file is named after the tool, and the comment above says
# what it does: the alternative is a module directory kept alive to hold a filename.
---

dontChroot: false
timeout: 60
script:
    - "sh"
    - "-c"
    - |
      set -e

      # 1. Nothing that belongs to the live session survives into an installed system.
      rm -f /etc/lightdm/lightdm.conf.d/99-astraos-live-variant.conf
      rm -f /etc/lightdm/lightdm.conf.d/99-astraos-live.conf
      rm -f /etc/lightdm/lightdm.conf.d/*live*.conf

      # 2. Neutralise the autologin live-config wrote into the main conffile at boot.
      #    The keys are commented out rather than deleted, so lightdm still documents
      #    them as its defaults and an upgrade of the lightdm package does not fight
      #    a hand-edited file.
      if [ -f /etc/lightdm/lightdm.conf ]; then
          sed -i -r \
              -e 's|^[[:space:]]*autologin-user=.*$|#autologin-user=|' \
              -e 's|^[[:space:]]*autologin-session=.*$|#autologin-session=|' \
              -e 's|^[[:space:]]*autologin-user-timeout=.*$|#autologin-user-timeout=0|' \
              /etc/lightdm/lightdm.conf
      fi

      # 3. State the policy in the installed system's own drop-in. It sorts after the
      #    image's 50-astraos.conf and after anything left in the main file, so the
      #    installed system cannot be talked into an autologin by a stray key.
      install -d /etc/lightdm/lightdm.conf.d
      cat > /etc/lightdm/lightdm.conf.d/90-astraos-installed.conf <<'ASTRAOS'
      [Seat:*]
      autologin-user=
      autologin-user-timeout=0
      autologin-session=
      ASTRAOS

      # 4. Fail the installation rather than ship an autologin the user did not ask
      #    for. A check that only prints a warning is a check that gets ignored.
      test -s /etc/lightdm/lightdm.conf.d/90-astraos-installed.conf
      if grep -rqE '^[[:space:]]*autologin-user=[^[:space:]]+' /etc/lightdm/ 2>/dev/null; then
          echo "AstraOS: an autologin survived into the installed system; refusing" >&2
          exit 1
      fi
