# AstraOS installer entry requirements (Calamares welcome module).
#
# These are the checks shown before the user can begin. They are deliberately modest so
# the installer does not refuse to run on a machine that would actually work, and
# deliberately not zero so the installer does not begin on a machine that cannot
# complete (plan §19: the documented VM baseline is 2 CPUs, 4 GB RAM, 30 GB disk).

# Minimum free memory for the installer itself, in MiB. The desktop session needs more,
# but by the time the installer runs the desktop is already up, so failing here on a
# machine that is obviously too small is the useful check.
requiredRam: 2048

# Minimum free disk space on the target, in MiB. The installed system is a desktop
# with a browser and office tools; less than this makes a frustrating installation.
# 8 GiB is the floor, not a recommendation.
requiredStorage: 8192

# Hardware checks are informational. A virtual machine legitimately fails several of
# them, and AstraOS is explicitly intended to be tested in VirtualBox, so none of these
# block installation.
check:
    - storage
    - ram
    - power
    - internet

# Do not block on having a network connection: an AstraOS installation works offline
# (plan §1, §21).
internetCheckUrl: "https://astraos.invalid/connectivity-check"
