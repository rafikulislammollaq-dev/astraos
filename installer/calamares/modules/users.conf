# AstraOS user creation policy (Calamares users module).
#
# Requirements from plan §10.4 and §13.1:
#   * create a normal, non-root account;
#   * administrative rights come from the sudo group, not from root;
#   * no shared or preset password is ever shipped;
#   * the root account is not enabled for login.
#
# Every key below was checked against the users module's own source in the exact
# Calamares version Debian 13 ships (3.3.14, src/modules/users/Config.cpp). A key the
# module does not read is not configuration, it is a sentence that looks like one:
# this file used to carry three of those — allowReuseOfExistingPassword, a top-level
# userShell, and a username: validation block — and all three were removed.

# Keep the root account locked. The module reads setRootPassword and its default is
# TRUE when the key is absent: the installer had been offering to set a root password
# and asking whether the user's password should be reused for it. false hides both and
# the target's root account stays disabled for login (plan §13.1).
setRootPassword: false

# The user is created with their own password, and this is the only password the
# installer asks for. The password is never written anywhere by AstraOS tooling; it is
# handled by Calamares and hashed into /etc/shadow on the target system. The module
# reads the shell from the user: submap (Config.cpp: getSubMap(config, "user")), not
# from a top-level key.
user:
    shell: /bin/bash

# The created account is an administrator through group membership, not through root.
# Adding to "sudo" is what grants privilege escalation after a password prompt.
defaultGroups:
    - "audio"
    - "cdrom"
    - "video"
    - "plugdev"
    - "sudo"
    - "netdev"
    - "bluetooth"
    - "lpadmin"
    - "scanner"

# A password every time — any password, but not none. With no requirements configured
# the module's check list is empty, and its own passwordStatus() then reports the
# EMPTY string as valid: Next enables and the installation proceeds with no password.
# minLength 1 makes an empty password invalid and keeps Next disabled until one is
# typed. The module separately requires the confirmation field to match, and the
# username rules are the module's own (a username: block here would be read by
# nothing).
passwordRequirements:
    minLength: 1

# Do not pre-fill any name, hostname or username: a pre-filled field becomes a shared
# default. Calamares can preset exactly two values (presets: fullName and
# presets: loginName); neither is present here, and a password cannot be preset at
# all. No email is collected.

# No autologin. AstraOS never logs a user in without authentication (plan §7.3).
# The users module writes /etc/lightdm/lightdm.conf only when doAutologin is set, so
# leaving this at false means lightdm.conf keeps the AstraOS policy of no autologin.
doAutologin: false

# Do not require an email address, an online account or any network service to install.
# AstraOS installations work fully offline (plan §1, §21).
