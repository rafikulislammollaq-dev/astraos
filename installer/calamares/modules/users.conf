# AstraOS user creation policy (Calamares users module).
#
# Requirements from plan §10.4 and §13.1:
#   * create a normal, non-root account;
#   * administrative rights come from the sudo group, not from root;
#   * no shared or preset password is ever shipped;
#   * the root account is not enabled for login.

# Bypass the "do you want to use the same password for root?" question entirely.
# AstraOS does not activate a root login, so the installer must not offer one.
allowReuseOfExistingPassword: false

# The user is created with their own password, and this is the only password the
# installer asks for. The password is never written anywhere by AstraOS tooling; it is
# handled by Calamares and hashed into /etc/shadow on the target system.
userShell: /bin/bash

# The created account is an administrator through group membership, not through root.
# Adding to "sudo" is what grants privilege escalation after a password prompt.
defaultGroups:
    - "audio"
    - "cdrom"
    - "video"
    - "plugdev"
    - "sudo"
    - "netdev"
    - "bluetooth"
    - "lpadmin"
    - "scanner"

# Username rules: keep the ordinary Linux constraints so the account works with every
# tool on the system.
username:
    maxLength: 32
    minLength: 1
    # Validation is delegated to Calamares' own validator rather than a looser custom
    # rule, so an account that would break login is rejected here.
    allowedPattern: "[a-z_][a-z0-9_-]*"

# Do not pre-fill any name or username. A pre-filled field becomes a shared default.
# (No fullName, username, email or password values are set on purpose.)

# Require a password to be set. An installation with an empty password would be a
# security defect, so the summary step will not allow it to continue.
# NOTE: Calamares enforces non-empty passwords when no autologin is used.

# No autologin. AstraOS never logs a user in without authentication (plan §7.3).
# The users module writes /etc/lightdm/lightdm.conf only when doAutologin is set, so
# leaving this at false means lightdm.conf keeps the AstraOS policy of no autologin.
doAutologin: false

# Do not require an email address, an online account or any network service to install.
# AstraOS installations work fully offline (plan §1, §21).
