# AstraOS filesystem installation (Calamares unpackfs module).
#
# Copies the running live filesystem onto the target partition. This is the step that
# actually creates the installed system, and the reason the installed system does not
# depend on files that exist only in the live image (plan §10.5).

# The live root is a squashfs mounted by live-boot. The path below is the standard
# location a Debian live image uses; scripts/validate-iso.sh confirms that the ISO
# actually contains a filesystem at this name, so the two cannot drift apart silently.
unpack:
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""

# Note on the destination: an empty destination means "the root of the target mount
# point", which is where the target is mounted by the mount module immediately before
# this step runs. The order in settings.conf is mount, then unpackfs.
