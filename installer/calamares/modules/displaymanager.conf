# AstraOS display manager configuration for the INSTALLED system.
#
# This runs after unpackfs, on the target system, and it is what makes the installed
# system present the AstraOS login screen rather than a default one.

# LightDM is the display manager AstraOS uses (config/distribution.env).
displaymanagers:
    - lightdm

# The Xfce session is the default for every user.
desktopFile: "xfce"

# The greeter theme is reinstated explicitly. The unpacked image already carries the
# AstraOS greeter configuration, but restating it here means an installation cannot
# silently revert to an unbranded greeter if the live image's configuration changes.
lightdm:
    -   executable: "/usr/sbin/lightdm"
        desktopFile: "xfce"

# Enable the display manager on the installed system so it starts at boot. Without
# this the system boots to a text console and the user believes the installation failed.
enableLightDM: true

# Do not create a default user for the display manager: the user was created by the
# users module from the account the installer asked for.
# No autologin is configured here. AstraOS never logs a user in without authentication.

# Basic setup: the standard X11 session file.
basicSetup: false

# Services to enable on the installed system. These are the ones the desktop needs and
# cannot detect on its own. See the SERVICE-POLICY.txt in the installed image for the
# full rationale for every service.
services:
    - name: "NetworkManager"
      mandatory: false
    - name: "lightdm"
      mandatory: true
    - name: "bluetooth"
      mandatory: false
    - name: "cups"
      mandatory: false
    - name: "ufw"
      mandatory: false
