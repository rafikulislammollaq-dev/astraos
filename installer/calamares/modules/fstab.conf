# AstraOS /etc/fstab creation (Calamares fstab module).
#
# The same reason as installer/calamares/modules/mount.conf: this image installs upstream's
# `calamares` and deliberately not `calamares-settings-debian`, so a module config this
# repository does not ship is absent rather than "Debian's default".
#
# This module is the harmless case of that. It reads every one of its keys with a default,
# so job 12 of 27 ran and wrote a usable /etc/fstab in run 39233194012 - but an absent file
# silently substitutes those internal defaults for the values below, and one of them is
# wrong on a Debian system. `crypttabOptions` defaults to a plain `luks`. Debian's
# cryptsetup-initramfs unlocks the encrypted root filesystem with its own prompt, which
# needs `keyscript=/bin/cat` on the crypttab line; Calamares' own fstab.conf says so in as
# many words - "For Debian and Debian-based distributions, change the above line to:
# crypttabOptions: luks,keyscript=/bin/cat" - and AstraOS is Debian-based.
#
# That value is preparation, not a claim. No AstraOS installation with an encrypted root
# filesystem has ever been made or booted (docs/KNOWN_LIMITATIONS.md §2), and that entry
# does not change until one has. It is written down because the alternative - no file, a
# silent default, a decision nobody made - is the defect this whole class of bug is made of.
#
# Everything below the rule is Calamares 3.3.14's own fstab.conf, with that single line
# changed as upstream instructs.
---

# Additional options added to each line in /etc/crypttab
crypttabOptions: luks,keyscript=/bin/cat

# Options for handling /tmp in /etc/fstab
# Currently default (required) and ssd are supported
# The corresponding string can contain the following variables:
# tmpfs: true or tmpfs: false to either mount /tmp as tmpfs or not
# options: "<mount options>"
#
# Example:
#tmpOptions:
#    default:
#        tmpfs: false
#        options: ""
#    ssd:
#        tmpfs: true
#        options: "defaults,noatime,mode=1777"
#
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
