# AstraOS live-session account removal (Calamares removeuser module).
#
# WHAT THIS DOES
#   The live session's user account ("astra") exists in the image that is copied to the
#   target system. It is a live-environment account with sudo rights and no password, and
#   it must not exist on an installed system: an account with administrative rights and
#   no password is a security hole, and it is also confusing to see an extra user on the
#   login screen after installation (plan §10.4, §10.5).
#
# This module removes that account from the target system. The user's own account,
# created by the users module with the password they chose, is unaffected.

# The live user name. Must match ASTRAOS_LIVE_USER in config/distribution.env.
username: astra

# Also remove the account's home directory and any files it left behind. Leaving a home
# directory behind would leave configuration files owned by a deleted user.
removeHome: true
