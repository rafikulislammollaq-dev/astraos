# AstraOS bootloader installation (Calamares bootloader module).
#
# AstraOS uses GRUB, installed by the same Calamares module every GRUB-based
# distribution uses. No custom bootloader code exists in this project (plan §2.3,
# §5.1).

# Install GRUB for the running firmware: efiauto detects UEFI versus legacy BIOS and
# installs to the correct target. Hardcoding one target is the classic cause of an
# installation that does not boot.
efiBootLoader: "grub"
kernel: "/vmlinuz-linux"

# For UEFI installs, install the shim + signed GRUB so the system has a chance of
# booting with firmware that enforces signatures.
#
# WARNING: AstraOS 0.1.0 does NOT claim Secure Boot support. The shim is installed
# because it is harmless, but the boot path has not been verified under Secure Boot on
# any machine and Secure Boot is disabled in the live image's own boot configuration.
# See docs/KNOWN_LIMITATIONS.md. Do not tell users Secure Boot works.
installEFIFallback: true

# Timeout for the GRUB menu. Long enough to choose between AstraOS and another
# installed system, short enough not to be annoying on every boot.
timeout: 10

# Keep the boot menu visible instead of hiding it when only one OS is installed. A
# hidden menu makes recovery harder for no benefit.
# (GRUB's own configuration is generated by update-grub on the target system.)

# Generate the initramfs for the target system's kernel. AstraOS installs Debian's
# kernel package, so the standard initramfs-tools path applies.
# The installed system must not depend on the live image's initramfs (plan §10.5).

# Preserve other operating systems on the disk by running os-prober.
# This is what makes a dual-boot installation usable instead of hiding the user's
# existing system. It is on by default and is not disabled here.
