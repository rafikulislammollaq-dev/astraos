# AstraOS bootloader installation (Calamares bootloader module).
#
# AstraOS uses GRUB, installed by the same Calamares module every GRUB-based
# distribution uses. No custom bootloader code exists in this project (plan §2.3,
# §5.1).
#
# THIS FILE REPLACES CALAMARES' OWN; IT DOES NOT EXTEND IT. Calamares reads one config
# per module, first the copy at /etc/calamares/modules/, then a packaged one at
# /usr/share/calamares/modules/. So every key this module reads without a default has to be
# stated here, and a key that is missing is not a default, it is a KeyError in the middle of
# the installation.
#
# On this image that second path is empty. The project installs upstream's `calamares` and
# deliberately not `calamares-settings-debian`, which is where Debian's own /etc/calamares
# tree comes from, so a module config this repository does not ship is not "the Debian
# default" - it is nothing, and the module runs on its own internal defaults or not at all.
# See installer/calamares/modules/mount.conf, where that same fact was fatal: it is why a
# GRUB with every key it needs still could not install itself.
#
# Run 39230792183 is the bill for that. The installer filled the filesystems, reached job
# 26 of 27, and stopped:
#
#   ERROR: Error while running: KeyError: 'grubInstall'
#     main.py(654): run_grub_install <- (717): install_grub <- (897): prepare_bootloader
#     <- (927): run
#
# The GRUB block below is a verbatim copy of what Calamares 3.3.14's own bootloader.conf
# ships, which is the configuration upstream tests. `grubInstall` was the one that fired;
# `grubMkconfig`, `grubCfg`, `grubProbe` and `efiBootMgr` are the next four hard lookups on
# the same path (main.py lines 779, 719, 748 and 459) and would have fired immediately
# after it, one per attempt.

# Which bootloader to install. On a BIOS machine Calamares installs GRUB whichever value
# stands here (main.py: `elif efi_boot_loader == "grub" or fw_type != "efi"`), but on a
# UEFI machine only the four values upstream documents do anything at all: `grub`,
# `sb-shim`, `refind`, `systemd-boot`. Which *target* gets installed - x86_64-efi or
# i386-pc - is decided from the firmware Calamares found, not from this line; the install
# exercise's own log says so: `[PYTHON JOB]: "Bootloader: grub (bios)"`.
#
# This comment used to read "efiauto detects UEFI versus legacy BIOS". `efiauto` was an
# old Calamares value, it is not one this module accepts, and on a UEFI machine it falls
# past every branch to main.py's "combination ... not supported" *debug* line: a silent
# install with no bootloader at all. The value beside it has been `grub` the whole time -
# only the comment was stale, and a stale comment is a loaded gun aimed at whoever
# "restores" it.
efiBootLoader: "grub"

# GRUB 2 binary names and boot directory. "Some distributions (e.g. Fedora) use grub2-*
# (resp. /boot/grub2/) names" - these are Debian's names, which is what AstraOS installs.
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# For UEFI installs, copy GRUB to the firmware's fallback path as well
# (bootx64.efi), which is what lets a machine whose boot entries were wiped, or whose
# firmware has no usable NVRAM entry, still find a kernel.
#
# NOT the shim. No signed chain is installed: `efiBootLoader: "grub"` runs grub-install
# and nothing else, so the installed system's EFI binary is unsigned and firmware that
# enforces signatures will not boot it. The LIVE medium's signed chain is verified under
# enforcement (CI run 39028358504, 2026-10-17: the ISO reached the login prompt under
# OVMF's Secure Boot firmware with the Microsoft keys enrolled), but the INSTALLED
# system's boot path under Secure Boot has never been exercised - the install exercise's
# second boot does not use enforcing firmware. Do not tell users their installed system
# boots with Secure Boot on; docs/KNOWN_LIMITATIONS.md §1.2 records the exact state.
#
# A comment that claimed the shim was installed here stood until run 39230792183. It
# described something this configuration has never done, which is the same defect as a
# key that is dead: it reads like a decision.
installEFIFallback: true

# TWO KEYS THAT STOOD HERE HAVE BEEN REMOVED, because Calamares 3.3.14's bootloader module
# reads neither of them and both read like policy:
#
#   kernel: "/vmlinuz-linux"    No key named `kernel` exists in this module at all. The
#                               path named Arch's kernel, not a Debian one (/boot/vmlinuz-
#                               <version> is what the kernel package installs), and the
#                               installed system's initramfs comes from initramfs-tools on
#                               the target. It was dead config describing a decision
#                               nobody was making.
#   timeout: 10                 GRUB's menu timeout is GRUB_TIMEOUT in /etc/default/grub on
#                               the installed system, which update-grub reads. Nothing in
#                               this module reads a `timeout` key.
#
# Generate the initramfs for the target system's kernel. AstraOS installs Debian's kernel
# package, so the standard initramfs-tools path applies. The installed system must not
# depend on the live image's initramfs (plan §10.5).

# Preserve other operating systems on the disk by running os-prober. This is what makes a
# dual-boot installation usable instead of hiding the user's existing system. It is on by
# default and is not disabled here.
