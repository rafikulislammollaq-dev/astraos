# AstraOS partitioning policy (Calamares partition module).
#
# This file encodes the disk-safety requirements of plan §10.3 and Rule 9. Every
# setting here is checked by 0300-installer.hook.chroot at build time, so a change that
# removes a safety property fails the build instead of shipping.
#
# WHAT THIS MODULE IS ALLOWED TO DO
#   Calamares performs all partitioning through kpmcore. AstraOS does not ship, and
#   must not ship, a custom partitioning program (plan §10.1).

# --- Filesystems (plan §11) ---------------------------------------------------
# ext4 for the root filesystem: well supported, well understood, easy to recover.
defaultFileSystemType: "ext4"

# Offered alternatives. Every one of these is installed on the live image, so choosing
# one cannot fail because a tool is missing.
availableFileSystemTypes:
    - "ext4"
    - "ext3"
    - "xfs"
    - "btrfs"
    - "f2fs"

# --- Safety -------------------------------------------------------------------
# Show the user exactly which partitions will be created or destroyed, always.
# Without this, "erase disk" is a single click that the user cannot verify.
alwaysShowPartitionLabels: true

# The default choice is NOT to erase a disk. The user must actively select a disk and
# a partitioning scheme, or the "Next" button stays unavailable. This is the specific
# control that stops a mis-click from destroying someone's data.
initialPartitioningChoice: none
initialSwapChoice: none

# Do not draw nested partitions: it makes the display denser and easier to misread,
# which is the opposite of what a destructive operation needs.
drawNestedPartitions: false

# Do not offer to install alongside another operating system automatically. Detecting
# an existing OS and proposing a resize is a common source of destroyed installations,
# so it is left to the user to choose manual partitioning or to free space themselves.
enableLuksAutomatedPartitioning: true
allowManualPartitioning: true

# --- EFI ----------------------------------------------------------------------
# 512 MiB ESP, matching the value recorded in config/distribution.env.
efiSystemPartitionSize: 512M
# Do not create the ESP on a disk that is not being used for /boot/efi.
efiSystemPartition: "/boot/efi"
# Require an EFI partition when booting in UEFI mode; failing loudly is better than
# producing an installation that cannot boot.
ensureSuspendToDisk: false

# --- Swap ---------------------------------------------------------------------
# No swap partition is created by default: a swap file is simpler to resize and does
# not commit a partition slot. The user can still choose a swap partition manually.
swapPartitionLabel: "swap"

# --- Encryption (plan §11) ----------------------------------------------------
# Encryption is OFFERED through the documented Calamares LUKS path when the user
# selects it. It is never applied silently, and AstraOS never claims a system is
# encrypted unless the user chose it.
# NOTE: this only controls whether the automated-LUKS option is offered. Choosing it
# is a user action, and the summary screen shows it before anything is written.

# --- Device filtering ---------------------------------------------------------
# Show all real disks, including NVMe and USB-attached devices, because a user testing
# AstraOS may well be installing to an external drive. Nothing is selected by default,
# so a broad list is safe.
# Do not hide any device; do not pre-select any device.
