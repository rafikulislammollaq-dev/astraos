# AstraOS machine identity (Calamares machineid module).
#
# WHY THIS MATTERS
#   /etc/machine-id must be unique per installation. If it is not, two machines
#   generated from the same image claim the same identity, which breaks the DHCP client
#   identifier and several systemd services, and it can confuse licensing and logging in
#   ways that are hard to diagnose.
#
# The image build therefore CLEARS /etc/machine-id (see
# 0600-cleanup.hook.chroot), and this module regenerates it on the installed system.

# "new" generates a fresh random machine-id on the target system.
# The alternatives are "uninitialized" (leave it empty) and "keep" (preserve the live
# system's) - both of which are wrong here for the reason above.
# A serial number from the firmware would be ideal but is not readable on every machine,
# so a random id is used.
setMachineId: new
