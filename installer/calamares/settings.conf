# AstraOS installer sequence (Calamares settings.conf).
#
# Format: YAML, as required by Calamares 3.x. The module list under each show:/exec:
# step names modules that MUST be installed; 0300-installer.hook.chroot verifies at
# build time that every one of them exists, and refuses to build an installer whose
# sequence references a module that is not present.
#
# STEP ORDER MATTERS AND IS DELIBERATE
# ------------------------------------
# 1. welcome / locale / keyboard / partition  - no destructive action is possible yet.
#    The user has not chosen a disk and nothing has been written.
# 2. users / summary                          - the confirmation point. `summary` shows
#    the chosen disk, the chosen filesystem and the user account, and requires an
#    explicit confirmation before `exec` runs (plan §10.3).
# 3. unpackfs / machineid / ... / bootloader  - the destructive phase. It only runs
#    after the summary has been confirmed.
# 4. finished                                 - its own `show:` phase after the exec
#    phase, as upstream's own configuration has it. Calamares ends in what its
#    ViewManager source calls a "weird state" when no finished step follows an exec
#    step: the done page is what tells the user the installation succeeded, and
#    `quit-at-end: false` below keeps it on screen until they ask for the reboot.

---
# Branding component. Calendar/other components are left at Calamares defaults.
componentName: astraos

# Where Calamares looks for its modules. `local` resolves to the install prefix's
# calamares/modules directory; the two explicit paths cover the layouts that directory
# can have, and an entry whose directory does not exist is ignored.
#
# THIS KEY IS NOT OPTIONAL. Calamares 3.3 (src/libcalamares/Settings.cpp) hands
# YAML(config["modules-search"]) straight to its module search paths, so a settings
# file without it searches no directory at all: `calamares -d` logs "Found 0 modules",
# every module then "not found in module search paths", and the wizard opens on
# "Calamares Initialization Failed" instead of its first page. The install exercise
# for this release measured exactly that (run 38940011841): the error dialog drew, no
# page ever did, and the driver pressed Return through it until its deadline. The build
# hook checks that the modules EXIST under these directories; only this line makes
# Calamares look in them.
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules ]

# Do not let the installer run without a network check for updates: the live image is
# expected to install offline, so this is not forced.
disable-cancel: false
disable-cancel-during-exec: false

# Keep the installer's own logs, which are needed for troubleshooting a failed install.
# They are written on the live system only.
dont-chroot: false
oem-setup: false

# Explicit interactive behaviour. Both keys were verified against the Calamares version
# Debian 13 ships (3.3.14, src/libcalamares/Settings.cpp): the summary page is the
# confirmation, so no second "are you sure" prompt before the destructive phase, and
# the finished page waits for the user instead of the installer quitting by itself.
# Two keys this file used to carry — requirePassword and showPicker — are read by no
# Calamares in the pinned suite; they were removed rather than left posing as
# configuration.
prompt-install: false
quit-at-end: false

# Where Calamares' own translations come from.
# (The AstraOS installer itself has no separate translation catalogue in 0.1.0.)

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition

- show:
  - users
  - summary

- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  # The installer's own lock-down step, run by Calamares' stock `shellprocess`
  # module (see installer/calamares/modules/shellprocess.conf). It runs after
  # displaymanager because it edits the same files: the live medium has to
  # autologin and the installed system must not, and the installer is the only
  # place that can tell the two apart. It is named after the module rather than
  # after the job because the build hook resolves every name in this list to a
  # module directory shipped by Calamares.
  - shellprocess
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - umount

- show:
  - finished

branding: astraos

# Prompts shown while the destructive phase runs, in the user's language where a
# translation exists.
# NOTE: the AstraOS branding directory supplies the visual identity; this list only
# drives the progress text.
