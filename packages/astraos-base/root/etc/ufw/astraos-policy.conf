# AstraOS firewall policy intent.
#
# This file documents the rules AstraOS expects a user to apply if they want the host
# firewall active. It is NOT executed automatically. /etc/default/ufw (shipped by the
# ufw package and written at image build time) carries the default policies.
#
# WHY THE FIREWALL IS NOT ENABLED BY DEFAULT
#   AstraOS installs no listening network services: there is no sshd, no web
#   server and no remote administration daemon (see /usr/share/astraos/SERVICE-POLICY.txt
#   in an installed system). Enabling ufw during the live session can also break the
#   network the user needs in order to install. Instead the policy is documented here and
#   enabling it is a documented, one-command decision.
#
# TO ENABLE
#   sudo ufw default deny incoming
#   sudo ufw default allow outgoing
#   sudo ufw allow out 67,68/udp     # DHCP client
#   sudo ufw allow out 53            # DNS
#   sudo ufw allow out 5353/udp      # mDNS (avahi)
#   sudo ufw enable
#   sudo ufw status verbose
#
# The outbound allowances above exist because a default-deny outbound policy breaks
# DHCP, DNS and local service discovery (plan §13.4: "avoid rules that unnecessarily
# break local networking or DHCP").
#
# INSPECTING THE CURRENT STATE
#   sudo ufw status verbose
#   astraos-info | grep firewall
