# AstraOS display manager policy.
#
# Installed as /etc/lightdm/lightdm.conf.d/50-astraos.conf. A drop-in is used instead of
# editing /etc/lightdm/lightdm.conf because lightdm owns that file as a conffile, and
# drop-ins are the supported way for a package to configure LightDM without fighting the
# upstream package.
#
# Files in lightdm.conf.d are read in name order after the main configuration file, so
# this file overrides the defaults without replacing them.

[Seat:*]
# Session and greeter selection.
greeter-session=lightdm-gtk-greeter
user-session=xfce

# SECURITY, AND THE LIVE MEDIUM (0.2.1)
#
# On an INSTALLED system AstraOS never logs a user in without authentication
# (plan §7.3, §10.4). That lock-down is written into the target by
# installer/calamares/modules/lockdown.conf, and it is deliberately NOT written here.
#
# The file you are reading ships inside the live image too, and drop-ins are read after
# the main configuration file. live-config creates the live medium's autologin by
# editing the commented autologin keys in /etc/lightdm/lightdm.conf at boot, and while
# this file said `autologin-user=` it cancelled that again - so a 0.2.0 live boot could
# stop at the greeter and ask for a password that nobody had been given. On a live
# medium autologin is correct: the account is throwaway and its password is public
# (see live-config's 0030-live-debconfig_passwd). The two halves belong in two places,
# and the installer is the half that survives onto the disk.

# SECURITY: no guest session and no user list enumeration hiding.
allow-guest=false
greeter-hide-users=false
greeter-show-manual-login=true
greeter-allow-guest=false

# The greeter must never start a root session.
greeter-show-remote-login=false

# Reasonable timeouts so a failed greeter does not hang the boot forever.
xserver-command=X -core
start-default-seat=true
