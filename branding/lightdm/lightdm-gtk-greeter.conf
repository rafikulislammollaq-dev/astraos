# AstraOS greeter configuration.
#
# Installed to /etc/lightdm/lightdm-gtk-greeter.conf at image build time by
# 0100-identity.hook.chroot, because lightdm-gtk-greeter owns that path as a conffile
# and a package of ours cannot ship it without a dpkg file conflict. The source of
# truth is this file in the repository.
#
# This is the greeter's visual layer only. Authentication policy (no autologin, no
# guest, no root session) lives in 50-astraos.conf, which LightDM applies first.

[greeter]
# The generated neon login background: ring offset left, darkened right-hand third so
# the login panel stays readable (branding/tools/render_assets.py).
background=/usr/share/astraos/wallpapers/astraos-login-background-1920x1080.png

# Do not replace the background with the selected user's own wallpaper: the AstraOS
# identity must be present on every login screen.
user-background=false

# AstraOS desktop theme and icon theme.
theme-name=AstraOS-Dark
icon-theme-name=AstraOS
font-name=DejaVu Sans 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb

# Layout: panel at the bottom, the AstraOS mark above the login fields.
position=50%,center
panel-position=bottom
indicators=~host;~spacer;~clock;~spacer;~session;~power

clock-format=%a %d %b  %H:%M:%S

# Accessibility: a screen-reader-friendly greeter is available with the a11y indicator.
a11y-states=~contrast;~font;~keyboard;~reader

# Keep the greeter keyboard-navigable (plan §7.5).
keyboard-layouts-section=false

# Do not show the version string in the greeter; it is available from astraos-info.
show-version=false

hide-user-image=false

[greeter-wrapper]
# Placeholder section kept so the file structure is explicit; no wrapper is used.
