<?xml version="1.0" encoding="UTF-8"?>
<!--
  AstraOS primary mark: the neon ring.

  Matches reference screen 1 (boot/login): a single circular ring with an angular
  pink -> purple -> cyan gradient, a soft bloom, and one orbiting arc.

  Original artwork created for AstraOS. Not derived from any other operating system's
  logo or trademark (plan §7.1, §23).

  Palette values come from config/branding.env:
    pink    #FF5CC8   purple  #8B3DFF   cyan  #22E6FF
    magenta #FF2FB9   void    #05030A
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="AstraOS">
  <title>AstraOS</title>

  <defs>
    <!-- Angular gradient: approximated with a rotated linear gradient plus a radial
         accent, which renders identically in every SVG consumer (GRUB, LightDM,
         browsers, Inkscape) without relying on SVG 2 conic gradients. -->
    <linearGradient id="astraRing" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%"   stop-color="#FF5CC8"/>
      <stop offset="38%"  stop-color="#FF2FB9"/>
      <stop offset="62%"  stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#22E6FF"/>
    </linearGradient>

    <linearGradient id="astraArc" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%"   stop-color="#22E6FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF5CC8" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="astraInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8B3DFF" stop-opacity="0.30"/>
      <stop offset="62%"  stop-color="#FF2FB9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#05030A" stop-opacity="0.00"/>
    </radialGradient>

    <!-- Bloom: two blurred copies blended over the crisp stroke. -->
    <filter id="astraBloom" x="-45%" y="-45%" width="190%" height="190%"
            filterUnits="objectBoundingBox">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="bloomWide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"  result="bloomTight"/>
      <feMerge>
        <feMergeNode in="bloomWide"/>
        <feMergeNode in="bloomTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="astraSpark" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Interior veil so the ring reads as a portal rather than a flat outline. -->
  <circle cx="256" cy="256" r="182" fill="url(#astraInner)"/>

  <!-- Bloom pass -->
  <circle cx="256" cy="256" r="182" fill="none"
          stroke="url(#astraRing)" stroke-width="9" opacity="0.75"
          filter="url(#astraBloom)"/>

  <!-- Crisp ring -->
  <circle cx="256" cy="256" r="182" fill="none"
          stroke="url(#astraRing)" stroke-width="9"/>

  <!-- Hairline echo of the ring path, offset outward: reads as a machined edge. -->
  <circle cx="256" cy="256" r="196" fill="none"
          stroke="#22E6FF" stroke-width="1" opacity="0.22"/>

  <!-- Orbiting arc: the "motion" of the mark. -->
  <path d="M 256 74 A 182 182 0 0 1 438 256"
        fill="none" stroke="url(#astraArc)" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Highlight where the arc meets the ring. -->
  <circle cx="430" cy="196" r="7" fill="#FFFFFF" opacity="0.95"
          filter="url(#astraSpark)"/>

  <!-- Four-point star flare at the centre, as in the reference desktop. -->
  <g filter="url(#astraSpark)" opacity="0.9">
    <path d="M 256 168 L 262 250 L 344 256 L 262 262 L 256 344 L 250 262 L 168 256 L 250 250 Z"
          fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
